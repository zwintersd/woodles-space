name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: woodles.space

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: woodles.space/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and Svelte diagnostics
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build all applications
        run: pnpm build

      # HomeSuite's seams — frames, saves, the bridge — only exist in a browser.
      # The rest of e2e/ is not CI-ready yet, so this runs HomeSuite's own spec
      # and its accessibility audit, not the whole suite.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run HomeSuite browser tests
        run: pnpm exec playwright test e2e/homesuite.spec.ts e2e/accessibility.spec.ts --grep "HomeSuite|homesuite"

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: woodles.space/playwright-report
          retention-days: 7
