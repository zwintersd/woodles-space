<!-- carillon: corner filigree (bl): a gilt bracket over the card's rounded
     inner rule, a ruby quarry at the corner, and along each edge a scroll
     that curls in under the rule and runs out to a leaf and two dots.
     drawn at 1 unit = 1px; the rule sits at 5.5, matching outline-offset -6px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
<defs><linearGradient id="gilt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4d98a"/><stop offset=".45" stop-color="#c39338"/><stop offset="1" stop-color="#8a5c16"/></linearGradient></defs>
<g transform="matrix(1 0 0 -1 0 56)">
<g fill="none" stroke="url(#gilt)" stroke-linecap="round" stroke-linejoin="round">
<path d="M5.5 26 V14.5 Q5.5 5.5 14.5 5.5 H26" stroke-width="1.9"/>
<path d="M9.8 20.5 V15.8 Q9.8 9.8 15.8 9.8 H20.5" stroke-width=".85"/>
<g id="arm"><path d="M26 5.5 C30.6 5.5 33.2 6.6 34.6 9.2 C35.9 11.8 33.7 14 31.6 12.9 C29.9 12 30.5 9.9 32.2 10.3" stroke-width="1.25"/>
<path d="M34.9 7.4 C37.6 5.8 40.8 5.4 45 5.5" stroke-width="1"/>
<path d="M37.6 6.6 C39 4.2 41.8 3.3 44 3.7 C42.8 5.8 40.2 6.9 37.6 6.6 Z" fill="url(#gilt)" stroke-width=".5"/></g>
<g transform="matrix(0 1 1 0 0 0)"><path d="M26 5.5 C30.6 5.5 33.2 6.6 34.6 9.2 C35.9 11.8 33.7 14 31.6 12.9 C29.9 12 30.5 9.9 32.2 10.3" stroke-width="1.25"/>
<path d="M34.9 7.4 C37.6 5.8 40.8 5.4 45 5.5" stroke-width="1"/>
<path d="M37.6 6.6 C39 4.2 41.8 3.3 44 3.7 C42.8 5.8 40.2 6.9 37.6 6.6 Z" fill="url(#gilt)" stroke-width=".5"/></g>
</g>
<g fill="url(#gilt)"><circle cx="48.4" cy="5.5" r="1.05"/><circle cx="52" cy="5.5" r=".7"/><circle cx="5.5" cy="48.4" r="1.05"/><circle cx="5.5" cy="52" r=".7"/><circle cx="23.6" cy="10" r=".8"/><circle cx="10" cy="23.6" r=".8"/></g>
