<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f7bf5" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Visual schedule · Schedule studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/schedules/view/styles.css" />
  <script src="/schedules/generator/shared.js" defer></script>
  <script src="/schedules/generator/publishing.js" defer></script>
  <script src="/schedules/view/app.js" defer></script>
</head>
<body>
<main class="schedule">
  <header class="hero">
    <div class="hero-topline"><span class="hero-kicker">One thing at a time</span><a class="edit-link" id="editLink" href="/schedules/generator">✎ Weekly planner</a><button class="edit-link" id="lockSchedule" type="button" hidden>Lock schedule</button></div>
    <div class="hero-content">
      <div class="hero-copy"><h1 id="greeting">Visual schedule</h1><p id="intro">Loading the plan saved on this device…</p><div class="hero-meta"><div class="clock" id="clock" aria-label="Current local time">Now: --:--</div><span class="hero-trail" aria-hidden="true"><i></i><i></i><i></i><b>✦</b></span></div></div>
      <svg class="hero-scene" viewBox="0 0 320 170" aria-hidden="true" focusable="false">
        <path d="M14 122C36 164 97 156 111 120S123 51 167 52S238 20 292 44" fill="none" stroke="#b5d5ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
        <g transform="translate(30 51) rotate(-13 34 43)"><g class="hero-ticket-float ticket-one">
          <rect x="3" y="6" width="68" height="86" rx="11" fill="#123c86" opacity=".3"/><rect width="68" height="86" rx="11" fill="#effff6" stroke="#cff6e1" stroke-width="2"/>
          <rect x="20" y="-5" width="28" height="12" rx="3" fill="#a8eacb" opacity=".95"/>
          <circle cx="34" cy="35" r="19" fill="#bcefd5"/><path d="m24 35 7 7 14-16" fill="none" stroke="#176451" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 65h32M24 73h20" stroke="#6aa58f" stroke-width="3" stroke-linecap="round"/>
        </g></g>
        <g transform="translate(121 23) rotate(9 40 52)"><g class="hero-ticket-float ticket-two">
          <rect x="4" y="7" width="80" height="104" rx="12" fill="#123c86" opacity=".3"/><rect width="80" height="104" rx="12" fill="#fff5d7" stroke="#ffe6a1" stroke-width="2"/>
          <path d="M16 14h48" stroke="#e6be61" stroke-width="3" stroke-linecap="round"/>
          <path d="M17 35q12-5 23 2 11-7 23-2v29q-12-5-23 2-11-7-23-2Z" fill="#ffce7a" stroke="#a75c2d" stroke-width="3" stroke-linejoin="round"/><path d="M40 38v26M23 44h10M47 44h10M23 52h10M47 52h10" stroke="#a75c2d" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M21 83h38M28 92h24" stroke="#ba9550" stroke-width="3" stroke-linecap="round"/>
        </g></g>
        <g transform="translate(223 77) rotate(-10 32 38)"><g class="hero-ticket-float ticket-three">
          <rect x="3" y="6" width="64" height="76" rx="11" fill="#123c86" opacity=".3"/><rect width="64" height="76" rx="11" fill="#ffe6eb" stroke="#ffd0da" stroke-width="2"/>
          <path d="m32 15 5 11 12 2-9 9 2 12-10-6-10 6 2-12-9-9 12-2Z" fill="#e36889" stroke="#9b3959" stroke-width="2" stroke-linejoin="round"/>
          <path d="M18 61h28" stroke="#bb7188" stroke-width="3" stroke-linecap="round"/>
        </g></g>
        <g class="hero-spark" fill="#ffdb75"><path d="m286 20 4 13 13 4-13 4-4 13-4-13-13-4 13-4Z"/><path d="m105 13 2 7 7 2-7 2-2 7-2-7-7-2 7-2Z"/></g>
        <path d="m16 64-6-6m290 69 7 3M207 146l-3 8" stroke="#cee5ff" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
  </header>

  <section class="nownext" id="nowNext" aria-live="polite" aria-label="Now and next" hidden>
    <div class="nn now"><small id="nowLabel">NOW</small><b id="nowText">…</b></div>
    <div class="nn"><small id="nextLabel">NEXT</small><b id="nextText">…</b></div>
  </section>
  <ol class="timeline" id="timeline" aria-label="Schedule" hidden></ol>
  <section class="notice" id="notice" hidden></section>

  <footer class="view-footer" id="footer" hidden>
    <p class="credits" id="credits"></p>
    <div class="footer-actions">
      <button class="reset" id="reset" type="button">Clear checks</button>
      <nav class="day-links" id="dayLinks" aria-label="Days in this plan"></nav>
    </div>
  </footer>
</main>
<div id="suggestionAnnouncement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
